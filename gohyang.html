<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>고향사랑기금</title>
  <meta name="description" content="지자체마다 고향사랑기금을 얼마나 굴리고, 어떤 사업에 얼마를 쓰고, 얼마를 남겨 두는지 지방재정365 세부사업 집행 자료로 봅니다.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/power.css">
  <link rel="stylesheet" href="assets/agfin.css">
  <link rel="stylesheet" href="assets/gohyang.css">
</head>
<body class="pw af gh">
  <div class="app">
    <header class="topbar">
      <div class="brand-wrap">
        <a class="brand" href="./">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>지역농업 현황판</span>
        </a>
        <nav class="tabs" aria-label="화면">
          <a href="./">주요 통계</a>
          <a href="rio">지역산업연관표(농업)</a>
          <a href="flow">물류동향</a>
          <a href="power">농사용 전기</a>
          <a href="employ">농업고용</a>
          <a href="agfin">농업금융보험</a>
          <a href="soil">농경지 토양</a>
          <a href="livestock">축산 환경</a>
          <a href="gohyang" aria-current="page">고향사랑기금</a>
        </nav>
      </div>
      <div class="controls">
        <label class="select">
          <span>시도</span>
          <select id="sido"></select>
        </label>
        <label class="select">
          <span>시군구</span>
          <select id="sgg"></select>
        </label>
        <label class="select">
          <span>연도</span>
          <select id="year"></select>
        </label>
      </div>
    </header>

    <main class="grid">
      <section class="col col-left" aria-label="기금 규모와 쓰임">
        <article class="panel" id="p-size">
          <header class="panel-head">
            <h2>기금 규모 <span class="h2-scope" id="size-scope"></span></h2>
            <span class="chip" data-year></span>
          </header>
          <div class="stats two">
            <div class="stat">
              <span class="stat-label" title="고향사랑기금 회계 세출 예산현액 합계. 전년에 남긴 돈과 그해 들어올 기부금 예상을 합친 크기">기금이 굴린 돈</span>
              <span class="stat-value"><b data-v="size"></b><small data-u="size"></small></span>
            </div>
            <div class="stat">
              <span class="stat-label" title="사업 갈래의 지출액 (지방재정365 집행 기준)">사업에 쓴 돈</span>
              <span class="stat-value"><b data-v="bizEp"></b><small data-u="bizEp"></small></span>
            </div>
            <div class="stat">
              <span class="stat-label" title="보전지출·예치금 등으로 잡은 돈. 그해 쓰지 않고 다음 해로 넘길 계획인 돈">남겨 둔 돈</span>
              <span class="stat-value"><b data-v="keep"></b><small data-u="keep"></small></span>
            </div>
            <div class="stat">
              <span class="stat-label">기금사업</span>
              <span class="stat-value"><b data-v="nBiz"></b><small data-u="nBiz"></small></span>
            </div>
          </div>
          <p class="gh-line" id="size-line"></p>
        </article>

        <article class="panel" id="p-split">
          <header class="panel-head">
            <h2>돈의 갈래 <span class="h2-scope">예산현액 기준</span></h2>
            <span class="chip" id="split-unit"></span>
          </header>
          <div class="gh-split" id="split-bar" aria-label="기금 예산의 갈래"></div>
          <div class="gh-split-rows" id="split-rows"></div>
          <p class="note" id="split-note"></p>
        </article>

        <article class="panel" id="p-years">
          <header class="panel-head">
            <h2>연도별 규모와 사업 지출</h2>
            <span class="chip" id="years-range"></span>
          </header>
          <div class="chart af-years" id="chart-years" aria-label="연도별 기금 규모와 사업 지출"></div>
          <div class="pw-key" id="years-key"></div>
        </article>
      </section>

      <section class="center" aria-label="지도">
        <div class="hero">
          <h1><span class="crumb" id="crumb"></span><span id="title-region">전국</span> 고향사랑기금</h1>
        </div>
        <div class="map-card" id="map-card">
          <div class="chipbar">
            <div class="chips" id="chips" role="group" aria-label="지도에 표시할 지표"></div>
          </div>
          <div class="map-wrap" id="map-wrap">
            <svg id="map" role="img" aria-label="지역 지도"></svg>
            <div class="tip" id="tip" hidden></div>
            <button class="reset" id="reset" type="button" hidden></button>
          </div>
          <div class="legend" id="legend"></div>
          <p class="pw-mnote" id="metric-note"></p>
          <div class="rank" id="rank"></div>
        </div>
      </section>

      <section class="col col-right" aria-label="기금사업">
        <article class="panel" id="p-list">
          <header class="panel-head">
            <h2>기금사업 <span class="h2-scope" id="list-scope"></span></h2>
            <span class="chip" id="list-count"></span>
          </header>
          <div class="gh-seg" id="kind-seg" role="group" aria-label="사업 갈래"></div>
          <label class="af-search">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input type="search" id="biz-q" placeholder="사업 찾기 (예: 경로당, 장학, 청년)" autocomplete="off" spellcheck="false" aria-label="사업 이름으로 찾기">
          </label>
          <div class="af-table-wrap">
            <table class="af-table gh-table" id="biz-table"></table>
          </div>
          <p class="note" id="list-note"></p>
        </article>

        <article class="panel" id="p-check">
          <header class="panel-head">
            <h2>이 자료로 알 수 없는 것</h2>
          </header>
          <ul class="gh-limits" id="limits"></ul>
        </article>
      </section>
    </main>

    <footer class="foot">
      <p title="지방재정365 Open API 세부사업별 세출현황(QWGJK). 전국 지자체 행을 받아 회계 이름에 '고향사랑'이 든 행(고향사랑기금)과 사업 이름에 '고향사랑'이 든 다른 회계 행만 남깁니다. 갈래(사업·운영·넘김·적립)는 사업 이름으로 나눈 자체 기준입니다. 금액은 예산현액과 지출액 그대로이며, 모금액(결산)이 아닙니다.">자료: 지방재정365 세부사업별 세출현황(고향사랑기금 회계, 각 연도 12월 31일 · 올해는 최근 월말). 금액은 예산현액·지출액이며 실제 모금액(결산)이 아닙니다.</p>
      <p id="built"></p>
      <p class="foot-link"><a href="status">자료 수집 현황</a></p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
  <script src="data/geo.js"></script>
  <script src="data/gohyang.js"></script>
  <script src="assets/mappan.js"></script>
  <script src="assets/gohyang.js"></script>
  <script src="assets/legendpick.js"></script>
  <script src="assets/about.js"></script>
</body>
</html>
