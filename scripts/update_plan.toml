# 자료 수집 계획 — scripts/update.py가 읽는다. 이 PC(로컬)에서만 돌린다(원자료·DB·지오코딩 캐시·API 키가 여기에 있다).
#
# method
#   auto   정해진 때(schedule)에 명령을 돌려 받는다
#   manual 사람이 원자료 파일을 받아 inputs 자리에 넣는다. 새 파일이 보이면 다음 실행 때 명령을 돌린다
#          (remind 주기마다 '새 자료 확인' 알림. 확인만 했으면: python scripts/update.py mark <id>)
#   event  행정구역 개편 같은 일이 있을 때만 사람이 돌린다 (자동 실행 없음, 기록만)
#   live   화면이 실시간으로 부른다 (수집 없음, 기록만)
# schedule (auto): monthly(day) · yearly(months, day)
# outputs: 바뀌면 커밋·푸시(Vercel 자동 배포)할 파일. 비어 있으면 DB만 갱신한다
# check: update.py의 검사 이름 (실패하면 outputs를 되돌리고 배포하지 않는다)

[[source]]
id = "kosis"
name = "주요 통계 (KOSIS·지방재정365)"
page = "주요 통계"
method = "auto"
schedule = { kind = "monthly", day = 20 }
commands = [["scripts/fetch_data.py"]]
outputs = ["data/data.js"]
check = "kosis"
keys = ["KOSIS_API_KEY", "lofin_api_key"]
note = "지표마다 발표 시기가 다르지만 스크립트가 늘 최신 시점을 가져온다. 가축동향은 분기(분기 끝 약 2개월 뒤), 농가·경지·쌀·귀농귀촌·농가경제·GRDP는 연 1회, 예산은 2~3월."

[[source]]
id = "kepco"
name = "농사용 전기 (한전 전력데이터 개방포털)"
