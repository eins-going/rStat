[[source]]
id = "logistics"
name = "물류기기 공동이용 실적 (물류동향·물류기기 사업동향)"
page = "물류동향, 물류기기 사업동향"
method = "manual"
inputs = ["agri_distribution_data/*.csv"]
remind = { months = 12, note = "매년 1~2월 전년도 실적 파일" }
commands = [["scripts/clean_raw.py"], ["scripts/build_db.py"], ["scripts/verify_db.py"], ["scripts/build_logistics.py"], ["scripts/build_od.py"], ["scripts/build_flow.py"]]
outputs = ["data/logistics.js", "data/od.js", "data/od_pallet.js", "data/od_woodbox.js", "data/od_boxpallet.js", "data/od_octagon.js", "data/od_wiremesh.js", "data/od_steelbox.js", "data/flow_mon.js"]
check = "logistics"
how = [
  "공개 내려받기 주소가 없는 원자료다. 제공처에서 연도별 CSV(cp949)를 받는다.",
  "agri_distribution_data/에 'YYYY년 물류기기 공동 이용-작성일.csv' 꼴로 넣는다 (같은 연도의 예전 파일은 지운다).",
  "다음 자동 실행 때 정제 → DB → 원자료 대조 검증 → 집계가 돌고, 검증을 통과하면 배포된다.",
]

