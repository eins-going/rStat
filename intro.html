<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>소개</title>
  <meta name="description" content="지역농업 현황판 소개 영상: 11개 화면과 위성지도, 벼 작황 예측의 정확도, 직불금·고향사랑기금, 그리고 만든 이의 생각.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/intro/intro.css">
</head>
<body class="it">
  <div class="app">
    <header class="topbar">
      <div class="brand-wrap">
        <a class="brand" href="./">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>지역농업 현황판</span>
        </a>
        <nav class="tabs" aria-label="화면">
          <a href="./">주요통계</a>
          <a href="rice">벼 작황</a>
          <a href="rio">지역산업연관표(농업)</a>
          <a href="flow">물류동향</a>
          <a href="power">농사용 전기</a>
          <a href="employ">농업고용</a>
          <a href="agfin">농업금융보험</a>
          <a href="jikbul">직불금·고향사랑</a>
          <a href="ruraldev">농촌개발</a>
          <a href="soil">농경지 토양</a>
          <a href="livestock">축산 환경</a>
        </nav>
      </div>
    </header>

    <main class="it-main">
      <div class="it-player" id="player">
        <div class="stage" id="stage" role="img" aria-label="지역농업 현황판 소개 영상: 시군 3차원 지도, 실제 현황판 화면, 위성지도, 쌀 단수 예측과 정확도, 직불금·고향사랑기금, 물류 흐름, 농사용 전기, 나머지 여섯 화면, 자료 수집 현황, 만든 이의 생각 순서로 보여 준다">
          <canvas id="bg"></canvas>
          <canvas id="gl"></canvas>
          <canvas id="fx"></canvas>
          <canvas id="sp"></canvas>
          <svg id="rice" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
          <svg id="spsvg" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
        </div>
        <button type="button" class="it-sndhint" id="sndhint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>소리 켜기</button>
        <button type="button" class="it-bigplay" id="bigplay" aria-label="재생"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
      </div>

      <div class="it-ctl">
        <button type="button" class="it-play" id="play" data-state="paused" aria-label="재생">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z"/></svg>
          <svg class="i-again" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3.8h3.8"/></svg>
        </button>
        <div class="it-trackwrap">
          <div class="it-track" id="track" role="slider" tabindex="0" aria-label="재생 위치(초)" aria-valuemin="0" aria-valuemax="106" aria-valuenow="0">
            <div class="it-fill" id="fill"></div>
          </div>
          <div class="it-chaps" id="chaps"></div>
        </div>
        <div class="it-sound">
          <button type="button" class="it-snd" id="snd" aria-pressed="false" aria-label="소리 켜기" data-on="0">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
          </button>
          <input type="range" id="vol" min="0" max="100" value="70" aria-label="음량">
          <button type="button" class="it-vo" id="vo" aria-pressed="true" hidden title="내레이션 켜고 끄기">해설</button>
        </div>
        <span class="it-chapname" id="chapname">00 열기</span>
        <span class="it-time" id="time">0:00 / 1:46</span>
        <a class="it-go" id="go" href="./" hidden>화면 열기 →</a>
      </div>
    </main>
  </div>
  <script src="assets/intro/intro_data.js"></script>
  <script src="assets/intro/intro.js"></script>
  <script src="assets/about.js"></script>
</body>
</html>
